# Jira Configuration
jira:
  cloud_id: "betfanatics.atlassian.net"
  story_points_field: "customfield_10016"
  story_points_fallback_fields:
    - "customfield_10026"
    - "customfield_10028"
    - "Story Points"
  sprint_prefix: "FNTSY"
  project_key: "FNTSY"
  # Agile board id used to list every active/future sprint regardless of
  # whether tickets have landed in it yet. Looked up once via
  # GET /rest/agile/1.0/board?projectKeyOrId=FNTSY&type=scrum.
  board_id: 6479
  # Top-level Jira initiative whose Feature → Epic → Story subtree drives the
  # Project snapshot (data/project_fantasy.json) and the Features / Readiness
  # pages. Re-point the whole initiative view by changing this one key.
  initiative_key: "INIT-185"
  # Confluence space key used to build the doc index + space links that appear
  # on the Project snapshot page.
  confluence_space: "DFS"
  # Full URL to the Jira Structure board surfaced under "Useful Links". It's a
  # full URL (not just a board id) because it embeds tenant-specific app GUIDs.
  structure_board_url: "https://betfanatics.atlassian.net/jira/apps/94d5de1a-112d-4549-bd03-5f910d5fd27b/880424a7-af14-4c77-b446-5ef9feee797a/structure/board/6464"

# Google Calendar Configuration
calendar:
  # Calendar the calendar-sync agent reads recurring 1-on-1 meetings from.
  # 'primary' = the authenticated account's own calendar.
  meetings_calendar_id: "primary"
  # Shared calendar everyone posts PTO / OOO to. The sync agent reads all-day
  # out-of-office events here and matches them to team members by attendee
  # email or by name in the event title. Leave blank to disable PTO sync.
  pto_calendar_id: "c_7dc89dec5edc28168901e040f72c9eb2df8c7b30b6b2e90a791833c1522f7f48@group.calendar.google.com"
  # How far ahead (days) to pull PTO so upcoming-sprint capacity reflects it.
  pto_lookahead_days: 120
  # How far back (days) to keep PTO so closed-sprint metrics stay accurate.
  pto_lookback_days: 120

